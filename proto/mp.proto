syntax = "proto3";

package mp;

option go_package = "github.com/DanielChachagua/ecommerce-noagestion-protos/pb;pb";

message DataInfoPay {
  string date_approved = 1;
  string date_created = 2;
  double id = 3; 
  string status = 4;
  string status_detail = 5;
  double transaction_amount = 6;
  TransactionDetails transaction_details = 7;
  
  // Como no hay structs anónimos, creamos un mensaje específico
  AdditionalInfo additional_info = 8;
  
  PaymentMethod payment_method = 9;
  PayerInfo payer = 10;
  string operation_type = 11;
  Metadata metadata = 12;
  string message = 13;
  string external_reference = 14;
}

message PayerInfo {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
}

message ItemsCartPay {
  string id = 1;
  string title = 2;
  string quantity = 3;
  string unit_price = 4;
}

message TransactionDetails {
  double net_received_amount = 1;
  double total_paid_amount = 2;
}

// Mensajes auxiliares para reemplazar los structs anónimos de Go
message AdditionalInfo {
  repeated ItemsCartPay items = 1; // repeated equivale a un slice []
  PayerInfo payer = 2;
}

message PaymentMethod {
  string type = 1;
}

message Metadata {
  string tenant_identifier = 1;
}

message DataInfoPayResponse{}

service MPService {
  rpc SyncPurchasePayment(DataInfoPay) returns (DataInfoPayResponse);
}